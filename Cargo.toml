[package]
name = "gpu_texture"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
anyhow = "1.0.100"
bytemuck = "1.23.2"
gl = "0.14.0"
glam = { version = "0.30.6", features = ["bytemuck"] }
glutin = { version = "0.32.3", features = ["egl", "wayland"] }
winit = { version = "0.30.12", features = ["rwh_06"] }
raw-window-handle = "0.6.2"

[dependencies]
nom = "^8.0.0"
bitflags = "^2.9.3"

[profile.release]
lto = "thin"
codegen-units = 1

[features]
default = ["dds", "ktx"]
# DirectDraw Surface container file support
dds = []
# Khronos Texture container file support
ktx = []

[[example]]
name = "load_dds_file"
path = "examples/load_dds_file/main.rs"
required-features = ["dds"]